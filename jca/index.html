<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JCA has moved into the Article Machine</title>
<meta name="robots" content="noindex">
<meta name="color-scheme" content="dark">
<!-- The JCA section was its own app at this address for its first day. It
     now lives inside the Article Machine at #/jca, so this page forwards
     there, carrying the old address across: #/c/sc-bench becomes
     #/jca/c/sc-bench, and an article (#/a/124) goes to the site's own
     article page. With scripts off, the link below does the same job. -->
<style>
  html,body{margin:0;background:#0b0b0f;color:#f1efe9;font:17px/1.6 system-ui,sans-serif}
  main{max-width:36rem;margin:18vh auto 0;padding:0 24px}
  a{color:#e3b93c}
</style>
<script>
(function () {
  var h = location.hash.replace(/^#\/?/, '');
  var first = h.split('/')[0];
  var to;
  if (first === 'a' || first === 'about') to = h;
  else if (!h) to = 'jca';
  else to = 'jca/' + h;
  location.replace('../#/' + to);
})();
</script>
</head>
<body>
<main>
  <p>The JCA section has moved into the Article Machine.</p>
  <p><a href="../#/jca">Open JCA in the Article Machine</a></p>
</main>
</body>
</html>
